# Supabase project settings used by the CLI (`supabase functions deploy`, `supabase start`).
project_id = "sellsharp"

# Browser-called functions keep the default (verify_jwt = true) AND re-check the user inside the function.
# Paystack cannot send a Supabase JWT; this function authenticates the request with Paystack's HMAC signature instead.
[functions.paystack-webhook]
verify_jwt = false
# Customers check out without an account, so the public order endpoint can't require a login.
# It is safe because it accepts no prices or payment status: the database prices the order and creates it as pending.
[functions.place-order]
verify_jwt = false
# Public help form accepts signed-out visitors. The function validates and stores the request server-side.
[functions.support-request]
verify_jwt = false
